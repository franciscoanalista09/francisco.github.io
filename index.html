<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W&D PÃES - Faça seu Pedido</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: linear-gradient(135deg, #f5e6d3 0%, #e8d5b7 100%);
    min-height: 100vh;
    padding: 20px;
    color: #3e2723;
    padding-bottom: 80px;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(62, 39, 35, 0.2);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
    color: white;
    padding: 30px 20px;
    text-align: center;
    border-bottom: 4px solid #D4AF37;
  }
  .header h1 { font-size: 32px; color: #D4AF37; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
  .header p { font-size: 14px; opacity: 0.9; margin-top: 5px; }
  .content { padding: 25px; }
  .input-field {
    width: 100%; padding: 12px 15px; border: 2px solid #D4AF37;
    border-radius: 10px; font-size: 15px; margin-bottom: 12px; outline: none;
  }
  .input-field:focus { border-color: #1a1a1a; }
  .item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; margin-bottom: 12px; background: #faf3eb;
    border-radius: 12px; border-left: 5px solid #D4AF37; transition: transform 0.2s;
  }
  .item:hover { transform: translateX(3px); }
  .item-left { display: flex; align-items: center; flex: 1; }
  .product-img {
    width: 65px; height: 65px; object-fit: cover;
    border-radius: 10px; margin-right: 12px; border: 2px solid #e8d5b7;
  }
  .product-emoji {
    width: 65px; height: 65px; display: flex; align-items: center; justify-content: center;
    font-size: 36px; margin-right: 12px; background: #fff;
    border-radius: 10px; border: 2px solid #e8d5b7;
  }
  .item-info { flex: 1; }
  .item-name { font-weight: 700; font-size: 16px; color: #3e2723; }
  .item-price { font-size: 13px; color: #8B4513; margin-top: 2px; }
  .counter { display: flex; align-items: center; gap: 10px; }
  .counter button {
    width: 36px; height: 36px; border: none; border-radius: 50%;
    background: #D4AF37; color: #1a1a1a; font-size: 20px; font-weight: bold;
    cursor: pointer; transition: all 0.2s;
  }
  .counter button:hover { background: #1a1a1a; color: #D4AF37; transform: scale(1.1); }
  .counter button:disabled { background: #ccc; color: #666; cursor: not-allowed; transform: none; }
  .counter span { font-size: 18px; font-weight: bold; min-width: 25px; text-align: center; }
  
  .payment-section { background: #f9f9f9; padding: 20px; border-radius: 12px; margin: 20px 0; border: 2px solid #D4AF37; }
  .payment-section h3 { color: #1a1a1a; margin-bottom: 15px; font-size: 16px; }
  .payment-option {
    display: flex; align-items: center; padding: 12px; background: white;
    border: 2px solid #ddd; border-radius: 8px; cursor: pointer; transition: all 0.2s; margin-bottom: 8px;
  }
  .payment-option:hover { border-color: #D4AF37; }
  .payment-option input[type="radio"] { margin-right: 10px; width: 18px; height: 18px; accent-color: #D4AF37; }
  .payment-option label { flex: 1; cursor: pointer; font-weight: 600; color: #333; }
  
  .pix-info { margin-top: 15px; padding: 15px; background: #e8f5e9; border-radius: 8px; border-left: 4px solid #4CAF50; display: none; }
  .pix-info.show { display: block; }
  .pix-key { font-size: 18px; font-weight: bold; color: #1a1a1a; margin: 10px 0; padding: 10px; background: white; border-radius: 6px; text-align: center; letter-spacing: 1px; }
  .btn-copy { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  .btn-copy:hover { background: #45a049; }
  
  .total {
    background: linear-gradient(135deg, #1a1a1a, #333); color: white;
    padding: 20px; border-radius: 12px; margin: 20px 0;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 18px; font-weight: bold; border: 2px solid #D4AF37;
  }
  .total-value { font-size: 24px; color: #D4AF37; }
  
  .btn-whatsapp {
    width: 100%; padding: 18px; background: #25D366; color: white;
    border: none; border-radius: 12px; font-size: 18px; font-weight: bold;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.2s; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
  }
  .btn-whatsapp:hover { background: #128C7E; transform: translateY(-2px); }
  .btn-whatsapp:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; transform: none; }
  
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #333; color: white; padding: 12px 24px; border-radius: 30px;
    font-size: 14px; opacity: 0; transition: all 0.3s; z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🥖 W&D PÃES</h1>
      <p>Faça seu pedido e envie pelo WhatsApp</p>
    </div>
    
    <div class="content">
      <input type="text" class="input-field" id="customerName" placeholder="👤 Seu nome">
      <input type="text" class="input-field" id="customerAddress" placeholder="🏠 Rua e número (opcional)">
      
      <div id="itemsList"></div>
      
      <div class="payment-section">
        <h3>💳 Método de Pagamento</h3>
        <div class="payment-option">
          <input type="radio" name="payment" id="credit" value="Cartão de Crédito">
          <label for="credit">💳 Cartão de Crédito</label>
        </div>
        <div class="payment-option">
          <input type="radio" name="payment" id="debit" value="Cartão de Débito">
          <label for="debit">💳 Cartão de Débito</label>
        </div>
        <div class="payment-option">
          <input type="radio" name="payment" id="pix" value="PIX">
          <label for="pix">💠 PIX</label>
        </div>
        
        <div class="pix-info" id="pixInfo">
          <p style="font-weight: bold; color: #2e7d32;">📱 Chave PIX (Telefone):</p>
          <div class="pix-key">(11) 93010-4748</div>
          <button class="btn-copy" onclick="copiarPix()">📋 Copiar Chave PIX</button>
        </div>
      </div>
      
      <div class="total">
        <span>Total a pagar:</span>
        <span class="total-value" id="totalValue">R$ 0,00</span>
      </div>
      
      <button class="btn-whatsapp" id="btnWhats" onclick="enviarWhatsApp()" disabled>
        <span>📱</span> Enviar Pedido no WhatsApp
      </button>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>

<script>
  const produtos = [
    { id: 'frances',  nome: 'Pão Francês',      emoji: '🥖', preco: 0.70, img: 'frances.jpg' },
    { id: 'leite',    nome: 'Pão de Leite',     emoji: '🥛', preco: 0.80, img: 'leite.jpg' },
    { id: 'carteira', nome: 'Pão Carteira',     emoji: '👛', preco: 0.80, img: 'carteira.jpg' },
    { id: 'milho',    nome: 'Pão de Milho',     emoji: '🌽', preco: 0.80, img: 'milho.jpg' },
    { id: 'coco',     nome: 'Pão de Coco Bola', emoji: '🥥', preco: 0.80, img: 'coco.jpg' },
    { id: 'creme',    nome: 'Pão de Creme',     emoji: '🍮', preco: 0.80, img: 'creme.jpg' },
    { id: 'frios',    nome: 'Pão de Frios',     emoji: '🥪', preco: 0.80, img: 'frios.jpg' },
    { id: 'queijo',   nome: 'Pão de Queijo',    emoji: '🧀', preco: 3.00, img: 'queijo.jpg' },
  ];
  
  const pedidos = {};
  produtos.forEach(p => pedidos[p.id] = 0);
  const PIX_KEY = '(11) 93010-4748';
  const PIX_KEY_RAW = '11930104748';
  
  document.querySelectorAll('input[name="payment"]').forEach(radio => {
    radio.addEventListener('change', function() {
      document.getElementById('pixInfo').classList.toggle('show', this.value === 'PIX');
    });
  });
  
  function copiarPix() {
    navigator.clipboard.writeText(PIX_KEY_RAW).then(() => {
      mostrarToast('✅ Chave Pix copiada! Cole no app do seu banco.');
    }).catch(() => {
      const input = document.createElement('input');
      input.value = PIX_KEY_RAW;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      mostrarToast('✅ Chave Pix copiada!');
    });
  }
  
  function mostrarToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }
  
  function renderizar() {
    const lista = document.getElementById('itemsList');
    lista.innerHTML = '';
    
    produtos.forEach(p => {
      const qtd = pedidos[p.id];
      const div = document.createElement('div');
      div.className = 'item';
      
      // Se tiver imagem, mostra a foto. Se não, mostra o emoji grande.
      const imagemHTML = p.img 
        ? `<img src="${p.img}" alt="${p.nome}" class="product-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
           <div class="product-emoji" style="display:none;">${p.emoji}</div>`
        : `<div class="product-emoji">${p.emoji}</div>`;

      div.innerHTML = `
        <div class="item-left">
          ${imagemHTML}
          <div class="item-info">
            <div class="item-name">${p.nome}</div>
            <div class="item-price">R$ ${p.preco.toFixed(2).replace('.', ',')} cada</div>
          </div>
        </div>
        <div class="counter">
          <button onclick="alterar('${p.id}', -1)" ${qtd === 0 ? 'disabled' : ''}>−</button>
          <span>${qtd}</span>
          <button onclick="alterar('${p.id}', 1)">+</button>
        </div>
      `;
      lista.appendChild(div);
    });
    
    let total = 0, totalItens = 0;
    produtos.forEach(p => {
      total += pedidos[p.id] * p.preco;
      totalItens += pedidos[p.id];
    });
    
    document.getElementById('totalValue').textContent = `R$ ${total.toFixed(2).replace('.', ',')} (${totalItens} itens)`;
    document.getElementById('btnWhats').disabled = totalItens === 0;
  }
  
  function alterar(id, delta) {
    pedidos[id] = Math.max(0, pedidos[id] + delta);
    renderizar();
  }
  
  function enviarWhatsApp() {
    const nome = document.getElementById('customerName').value.trim();
    const endereco = document.getElementById('customerAddress').value.trim();
    const itens = produtos.filter(p => pedidos[p.id] > 0);
    const pagamento = document.querySelector('input[name="payment"]:checked');
    
    if (itens.length === 0) { alert('Selecione pelo menos um item!'); return; }
    if (!pagamento) { alert('Selecione um método de pagamento!'); return; }
    
    let msg = `🥖 *PEDIDO - W&D PÃES*\n\n`;
    if (nome) msg += `👤 *Cliente:* ${nome}\n`;
    if (endereco) msg += `🏠 *Endereço:* ${endereco}\n`;
    if (nome || endereco) msg += `\n`;
    
    msg += `📋 *Itens do Pedido:*\n`;
    let total = 0;
    itens.forEach(p => {
      const qtd = pedidos[p.id];
      const subtotal = qtd * p.preco;
      total += subtotal;
      msg += `${p.emoji} ${p.nome} — ${qtd}x = R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
    });
    
    msg += `\n💰 *Total: R$ ${total.toFixed(2).replace('.', ',')}*\n`;
    msg += `\n💳 *Pagamento:* ${pagamento.value}`;
    if (pagamento.value === 'PIX') msg += `\n💠 *Chave PIX:* ${PIX_KEY}`;
    msg += `\n\n📅 ${new Date().toLocaleString('pt-BR')}`;
    
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  }
  
  renderizar();
</script>
</body>
</html>
